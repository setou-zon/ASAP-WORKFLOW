<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ASAP WORKPLAN | Suivi</title>
<meta name="description" content="Suivi des activités de vos projets : avancement, échéances, retards et comptes rendus, sur ordinateur et téléphone.">
<meta name="theme-color" content="#0a0a0a">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://challenges.cloudflare.com; frame-src https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://bfqloiprndsvcebffqgw.supabase.co wss://bfqloiprndsvcebffqgw.supabase.co; manifest-src 'self'; worker-src 'self'; base-uri 'self'; form-action 'self'; object-src 'none'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ASAP Suivi">
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
<style>
html{font-size:17px}
:root{
  --bg:#0a0a0a; --panel:#141414; --panel2:#1a1a1a; --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.14);
  --text:#f5f2ee; --muted:#8a8a8a; --muted2:rgba(245,242,238,.6);
  --accent:#ff4d1c; --accent2:#00e5a0; --warn:#f5a623; --blue:#4FC3F7; --red:#ff5a5a;
  --r:6px; --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family: 'EB Garamond', Garamond, Georgia, serif;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent2)}
.mono{font-family: 'EB Garamond', Garamond, Georgia, serif}
.hidden{display:none!important}
:focus-visible{outline:2px solid var(--accent2);outline-offset:2px}

/* Logo */
.logo{display:flex;align-items:center;gap:.65rem;text-decoration:none}
.logo svg{width:32px;height:32px;flex-shrink:0}
.logo b{display:block;font-family: 'EB Garamond', Garamond, Georgia, serif;font-weight:800;font-size:1rem;color:var(--text);line-height:1}
.logo i{display:block;font-style:normal;font-family: 'EB Garamond', Garamond, Georgia, serif;font-weight:700;font-size:.52rem;letter-spacing:.26em;color:var(--accent);margin-top:3px}

/* Boutons et champs */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.45rem;border:1px solid var(--line2);background:transparent;padding:.6rem 1rem;border-radius:var(--r);font-size:.88rem;font-weight:500;transition:background .15s,border-color .15s;white-space:nowrap}
.btn:hover{border-color:rgba(255,255,255,.3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:#e83d0d}
.btn.ghost{border-color:transparent;color:var(--muted2)}
.btn.ghost:hover{color:var(--text);background:rgba(255,255,255,.05)}
.btn.danger{color:var(--red);border-color:rgba(255,90,90,.3)}
.btn.sm{padding:.4rem .7rem;font-size:.8rem}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
label.f{display:block;margin-bottom:.9rem}
label.f>span{display:block;font-family: 'EB Garamond', Garamond, Georgia, serif;font-size:.62rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:.4rem}
input.i,select.i,textarea.i{width:100%;background:var(--bg);border:1px solid var(--line2);border-radius:var(--r);padding:.7rem .8rem;font-size:.95rem;transition:border-color .15s}
textarea.i{min-height:90px;resize:vertical}
input.i:focus,select.i:focus,textarea.i:focus{outline:none;border-color:var(--accent2)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:0 .9rem}
.err{color:var(--red);font-size:.85rem;margin:.4rem 0}
.ok{color:var(--accent2);font-size:.85rem;margin:.4rem 0}

/* Écran de connexion */
.auth{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:2rem 1rem;background:radial-gradient(ellipse 60% 50% at 80% 10%,rgba(255,77,28,.1),transparent 70%),radial-gradient(ellipse 50% 40% at 10% 90%,rgba(0,229,160,.06),transparent 60%)}
.auth-box{width:100%;max-width:400px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:2rem;position:relative;overflow:hidden}
.auth-box::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.auth h1{font-family: 'EB Garamond', Garamond, Georgia, serif;font-weight:800;font-size:1.5rem;margin:1.5rem 0 .3rem}
.auth p.sub{color:var(--muted);font-size:.88rem;margin-bottom:1.5rem}
.auth .switch{text-align:center;margin-top:1rem;font-size:.85rem;color:var(--muted)}
.auth .switch button{background:none;border:none;color:var(--accent2);text-decoration:underline;text-underline-offset:3px}

/* Structure principale */
.shell{display:grid;grid-template-columns:240px 1fr;min-height:100%}
.side{background:var(--panel);border-right:1px solid var(--line);padding:1.2rem .9rem;display:flex;flex-direction:column;gap:1.2rem;position:sticky;top:0;height:100vh}
.ws-pick{width:100%}
.nav{display:flex;flex-direction:column;gap:.2rem}
.nav button{display:flex;align-items:center;gap:.7rem;background:none;border:none;color:var(--muted2);padding:.65rem .75rem;border-radius:var(--r);text-align:left;font-size:.9rem}
.nav button svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.nav button:hover{background:rgba(255,255,255,.04);color:var(--text)}
.nav button.on{background:rgba(255,77,28,.12);color:var(--text)}
.nav button.on svg{stroke:var(--accent)}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:.5rem;font-size:.8rem;color:var(--muted)}
.side-foot .me{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
main{min-width:0;padding:1.6rem 2rem 3rem}
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:1rem;flex-wrap:wrap;margin-bottom:1.5rem}
.top h2{font-family: 'EB Garamond', Garamond, Georgia, serif;font-weight:800;font-size:1.6rem;letter-spacing:-.02em;line-height:1.15}
.top .crumb{font-family: 'EB Garamond', Garamond, Georgia, serif;font-size:.64rem;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin-bottom:.3rem}
.top .crumb button{background:none;border:none;color:inherit;font:inherit;letter-spacing:inherit;text-transform:inherit;text-decoration:underline;text-underline-offset:3px}
.actions{display:flex;gap:.5rem;flex-wrap:wrap}
.mobile-top,.tabbar{display:none}
.banner{padding:.6rem 1rem;font-size:.84rem;border-radius:var(--r);margin-bottom:1rem;display:flex;gap:.7rem;align-items:center;flex-wrap:wrap}
.banner.off{background:rgba(245,166,35,.1);border:1px solid rgba(245,166,35,.3);color:var(--warn)}
.banner.inst{background:rgba(0,229,160,.07);border:1px solid rgba(0,229,160,.25);color:var(--muted2)}
.banner.inst strong{color:var(--text)}

/* Cartes et KPI */
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:.8rem;margin-bottom:1.5rem}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:1rem 1.1rem}
.kpi .v{font-family: 'EB Garamond', Garamond, Georgia, serif;font-weight:800;font-size:1.8rem;line-height:1.1}
.kpi .l{font-family: 'EB Garamond', Garamond, Georgia, serif;font-size:.6rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-top:.3rem}
.kpi.red .v{color:var(--red)} .kpi.green .v{color:var(--accent2)} .kpi.orange .v{color:var(--accent)}
.kpis.k4{grid-template-columns:repeat(4,1fr)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
.grid2>*{min-width:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:1.2rem}
.card h3{font-family: 'EB Garamond', Garamond, Georgia, serif;font-weight:700;font-size:1rem;margin-bottom:.9rem;display:flex;justify-content:space-between;align-items:center;gap:.5rem}
.card h3 .mono{font-size:.62rem;color:var(--muted);font-weight:400;letter-spacing:.08em}
.empty{color:var(--muted);font-size:.88rem;padding:1.4rem;text-align:center;border:1px dashed var(--line2);border-radius:var(--r)}
.bar{height:6px;background:rgba(255,255,255,.07);border-radius:3px;overflow:hidden}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:3px}
.prow{display:grid;grid-template-columns:1fr 140px 44px;gap:.8rem;align-items:center;padding:.55rem 0;border-bottom:1px solid var(--line);font-size:.88rem;cursor:pointer}
.prow:last-child{border-bottom:none}
.prow:hover .pn{color:var(--accent2)}
.prow .pct{font-family: 'EB Garamond', Garamond, Georgia, serif;font-size:.75rem;color:var(--muted);text-align:right}

/* Projets */
.projects{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:1rem}
.pcard{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:1.2rem;cursor:pointer;transition:border-color .15s,transform .15s;position:relative;overflow:hidden;text-align:left;width:100%}
.pcard:hover{border-color:rgba(0,229,160,.35);transform:translateY(-2px)}
.pcard::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--pc,var(--accent))}
.pcard h4{font-family: 'EB Garamond', Garamond, Georgia, serif;font-weight:700;font-size:1.05rem;margin-bottom:.3rem}
.pcard p{color:var(--muted);font-size:.83rem;margin-bottom:1rem;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.5em}
.pmeta{display:flex;justify-content:space-between;font-family: 'EB Garamond', Garamond, Georgia, serif;font-size:.64rem;color:var(--muted);margin-top:.6rem;gap:.5rem;flex-wrap:wrap}

/* Pastilles */
.pill{display:inline-flex;align-items:center;gap:.35rem;font-family: 'EB Garamond', Garamond, Georgia, serif;font-size:.6rem;letter-spacing:.06em;text-transform:uppercase;padding:.22rem .5rem;border-radius:3px;white-space:nowrap}
.pill::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor}
.s-a_faire{color:var(--muted2);background:rgba(255,255,255,.06)}
.s-en_cours{color:var(--blue);background:rgba(79,195,247,.1)}
.s-bloque{color:var(--red);background:rgba(255,90,90,.1)}
.s-termine{color:var(--accent2);background:rgba(0,229,160,.1)}
.p-haute{color:var(--accent)} .p-normale{color:var(--muted2)} .p-basse{color:var(--muted)}
.late{color:var(--red)!important}
.tag{font-family: 'EB Garamond', Garamond, Georgia, serif;font-size:.6rem;padding:.15rem .45rem;border:1px solid var(--line2);border-radius:3px;color:var(--muted2)}

/* Tableau Kanban */
.board{display:grid;grid-template-columns:repeat(4,minmax(220px,1fr));gap:.8rem;overflow-x:auto;padding-bottom:.5rem}
.col{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:.8rem;min-height:140px;display:flex;flex-direction:column;gap:.6rem}
.col.drop{border-color:var(--accent2);background:rgba(0,229,160,.04)}
.col-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:.2rem}
.col-h .n{font-family: 'EB Garamond', Garamond, Georgia, serif;font-size:.7rem;color:var(--muted)}
.acard{background:var(--panel2);border:1px solid var(--line);border-radius:var(--r);padding:.8rem;cursor:pointer;text-align:left;width:100%;transition:border-color .15s}
.acard:hover{border-color:rgba(255,255,255,.22)}
.acard[draggable=true]{cursor:grab}
.acard .t{font-weight:500;font-size:.9rem;margin-bottom:.4rem;line-height:1.35}
.acard .m{display:flex;justify-content:space-between;align-items:center;gap:.4rem;font-size:.75rem;color:var(--muted);margin-top:.5rem;flex-wrap:wrap}
.view-toggle{display:inline-flex;border:1px solid var(--line2);border-radius:var(--r);overflow:hidden}
.view-toggle button{background:none;border:none;padding:.45rem .8rem;font-size:.8rem;color:var(--muted2)}
.view-toggle button.on{background:rgba(255,255,255,.08);color:var(--text)}

/* Tableau liste */
.filters{display:flex;gap:.6rem;flex-wrap:wrap;margin-bottom:1rem}
.filters .i{width:auto;min-width:150px;padding:.5rem .7rem;font-size:.85rem}
.filters input.i{flex:1;min-width:180px}
.tbl-wrap{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.86rem;min-width:760px}
th{text-align:left;font-family: 'EB Garamond', Garamond, Georgia, serif;font-size:.6rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:400;padding:.75rem .9rem;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:.7rem .9rem;border-bottom:1px solid var(--line);vertical-align:middle}
tr.click{cursor:pointer}
tr.click:hover td{background:rgba(255,255,255,.025)}
tr:last-child td{border-bottom:none}
td .bar{width:80px;display:inline-block;vertical-align:middle;margin-right:.4rem}

/* Liste mobile d'activités */
.alist{display:none;flex-direction:column;gap:.6rem}

/* Équipe */
.mrow{display:flex;align-items:center;gap:.8rem;padding:.7rem 0;border-bottom:1px solid var(--line)}
.mrow:last-child{border-bottom:none}
.av{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;font-family: 'EB Garamond', Garamond, Georgia, serif;font-weight:800;font-size:.85rem;color:#0a0a0a;flex-shrink:0}
.mrow .who{flex:1;min-width:0}
.mrow .who div{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mrow .who small{color:var(--muted);font-size:.78rem}

/* Fenêtres */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(5px);z-index:50;display:flex;align-items:center;justify-content:center;padding:1rem}
.mbox{background:var(--panel);border:1px solid var(--line2);border-radius:10px;width:100%;max-width:560px;max-height:92vh;overflow:auto;padding:1.6rem;position:relative}
.mbox.wide{max-width:720px}
.mbox h3{font-family: 'EB Garamond', Garamond, Georgia, serif;font-weight:800;font-size:1.25rem;margin-bottom:1.2rem;padding-right:2rem}
.mclose{position:absolute;top:.8rem;right:.8rem;background:none;border:none;color:var(--muted);font-size:1.6rem;width:36px;height:36px;line-height:1}
.mclose:hover{color:var(--text)}
.mfoot{display:flex;justify-content:space-between;gap:.6rem;margin-top:1.2rem;flex-wrap:wrap}
.mfoot .r{display:flex;gap:.6rem;margin-left:auto}
.range{display:flex;align-items:center;gap:.8rem}
.range input{flex:1;accent-color:var(--accent2)}
.range output{font-family: 'EB Garamond', Garamond, Georgia, serif;font-size:.85rem;width:3.2em;text-align:right}
.timeline{border-left:1px solid var(--line2);margin:.6rem 0 0 .4rem;padding-left:1rem;display:flex;flex-direction:column;gap:.9rem}
.tl{position:relative;font-size:.86rem}
.tl::before{content:'';position:absolute;left:-1.33rem;top:.45rem;width:9px;height:9px;border-radius:50%;background:var(--accent2)}
.tl small{display:block;color:var(--muted);font-size:.74rem;margin-bottom:.15rem}
.tl p{white-space:pre-wrap;color:var(--muted2)}
.sep{height:1px;background:var(--line);margin:1.3rem 0}
.toast{position:fixed;left:50%;bottom:calc(1.2rem + var(--safe-b));transform:translateX(-50%);background:var(--panel2);border:1px solid var(--line2);padding:.7rem 1.1rem;border-radius:var(--r);font-size:.88rem;z-index:80;box-shadow:0 10px 30px rgba(0,0,0,.5);max-width:90vw}
.toast.e{border-color:rgba(255,90,90,.5);color:var(--red)}
.loading{display:flex;align-items:center;justify-content:center;min-height:100%;color:var(--muted);font-family: 'EB Garamond', Garamond, Georgia, serif;font-size:.75rem;letter-spacing:.12em;flex-direction:column;gap:1rem}
.spin{width:28px;height:28px;border:2px solid var(--line2);border-top-color:var(--accent);border-radius:50%;animation:sp 0.8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}


/* Validation, administration, confidentialité */
.privacy-note{display:flex;gap:.6rem;align-items:flex-start;margin-top:1.1rem;padding:.75rem .85rem;border:1px solid rgba(0,229,160,.25);background:rgba(0,229,160,.06);border-radius:var(--r);font-size:.82rem;color:var(--muted2);line-height:1.5}
.privacy-note svg{width:18px;height:18px;flex-shrink:0;stroke:var(--accent2);fill:none;stroke-width:2;margin-top:.1rem}
.privacy-note b{color:var(--text)}
.privacy-card{border-color:rgba(0,229,160,.28)}
.privacy-card h3{justify-content:flex-start}
.privacy-card h3 svg{width:18px;height:18px;stroke:var(--accent2);fill:none;stroke-width:2}
.privacy-card ul{list-style:none;display:flex;flex-direction:column;gap:.55rem;font-size:.88rem;color:var(--muted2)}
.privacy-card li{padding-left:1.2rem;position:relative}
.privacy-card li::before{content:'✓';position:absolute;left:0;color:var(--accent2)}
.privacy-card b{color:var(--text)}
.privacy-card p{font-size:.9rem;color:var(--muted2)}
.ts-box{margin:.4rem 0 .6rem;min-height:65px}
.pending-ic{width:56px;height:56px;border-radius:50%;background:rgba(245,166,35,.12);display:flex;align-items:center;justify-content:center;margin-top:1.4rem}
.pending-ic svg{width:28px;height:28px;stroke:var(--warn);fill:none;stroke-width:1.8}
.acc-row{display:flex;align-items:center;gap:.8rem;padding:.75rem 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.acc-row:last-child{border-bottom:none}
.acc-row .who{flex:1;min-width:220px}
.acc-row .who small{color:var(--muted);font-size:.78rem}
.acc-row.big{padding:1rem 0}
.acc-act{display:flex;gap:.5rem;flex-wrap:wrap}
.nbadge{font-style:normal;background:var(--accent);color:#fff;font-size:.65rem;border-radius:10px;padding:.05rem .4rem;margin-left:auto;font-family:inherit}
.tabbar .nbadge{position:absolute;margin:0;transform:translate(14px,-4px)}
.tabbar button{position:relative}

/* Indicateurs */
.kpis.k5{grid-template-columns:repeat(5,1fr)}
.kgroup{margin-bottom:2rem}
.kg-h{display:flex;align-items:baseline;gap:.6rem;margin-bottom:.9rem;flex-wrap:wrap}
.kg-h h3{font-family: 'EB Garamond', Garamond, Georgia, serif;font-weight:700;font-size:1.15rem}
.kg-dot{width:10px;height:10px;border-radius:50%;align-self:center}
.kg-d{color:var(--muted);font-size:.85rem}
.kg-n{margin-left:auto;color:var(--muted);font-size:.75rem}
.kgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:1rem}
.ktile{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:1.1rem 1.1rem 1rem;cursor:pointer;position:relative;overflow:hidden;transition:border-color .15s,transform .15s;display:flex;flex-direction:column;gap:.45rem}
.ktile::before{content:'';position:absolute;left:0;top:0;right:0;height:3px;background:var(--kc)}
.ktile:hover{border-color:rgba(255,255,255,.22);transform:translateY(-2px)}
.kt-top{display:flex;justify-content:space-between;align-items:center;gap:.5rem}
.kt-cat{font-family: 'EB Garamond', Garamond, Georgia, serif;font-size:.6rem;letter-spacing:.12em;text-transform:uppercase;color:var(--kc)}
.kpill{font-family: 'EB Garamond', Garamond, Georgia, serif;font-size:.6rem;letter-spacing:.04em;text-transform:uppercase;display:inline-flex;align-items:center;gap:.3rem;white-space:nowrap}
.kpill::before{content:'';width:7px;height:7px;border-radius:50%;background:currentColor}
.ktile h4{font-family: 'EB Garamond', Garamond, Georgia, serif;font-weight:700;font-size:1rem;line-height:1.3}
.kt-proj{font-size:.78rem;color:var(--muted);margin-top:-.3rem}
.kt-val{display:flex;align-items:baseline;gap:.45rem;flex-wrap:wrap}
.kt-val b{font-family: 'EB Garamond', Garamond, Georgia, serif;font-weight:800;font-size:1.55rem;line-height:1.1}
.kt-val span{color:var(--muted);font-size:.82rem}
.kt-chart{height:64px;margin-top:.2rem}
.kchart{width:100%;height:100%;display:block}
.kt-foot{display:flex;justify-content:space-between;align-items:center;gap:.5rem;font-size:.75rem;color:var(--muted);margin-top:.2rem}
.khint{color:var(--muted);font-size:.78rem;margin-top:.5rem}
.kintro p{color:var(--muted2);font-size:.92rem;margin-bottom:1rem;max-width:760px}

};
const STATUS = { a_faire: 'À faire', en_cours: 'En cours', bloque: 'Bloqué', termine: 'Terminé' };
const PRIO = { haute: 'Haute', normale: 'Normale', basse: 'Basse' };
const PSTATUS = { actif: 'Actif', en_pause: 'En pause', termine: 'Terminé', archive: 'Archivé' };
const ROLES = { owner: 'Propriétaire', admin: 'Administrateur', member: 'Membre', viewer: 'Lecture seule' };
const COLORS = ['#ff4d1c', '#00e5a0', '#4FC3F7', '#f5a623', '#b388ff', '#ff6b9d'];

/* ---------- Utilitaires ---------- */
const $ = s => document.querySelector(s);
const esc = v => String(v == null ? '' : v).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const today = () => { const d = new Date(); d.setHours(0, 0, 0, 0); return d; };
const pd = s => s ? new Date(s + 'T00:00:00') : null;
const fd = s => s ? pd(s).toLocaleDateString('fr-FR', { day: '2-digit', month: 'short', year: 'numeric' }) : '-';
const fdt = s => new Date(s).toLocaleString('fr-FR', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' });
const isLate = a => a.status !== 'termine' && a.due_date && pd(a.due_date) < today();
const daysTo = s => Math.round((pd(s) - today()) / 86400000);
const initials = s => (s || '?').replace(/@.*/, '').split(/[\s._-]+/).filter(Boolean).slice(0, 2).map(x => x[0].toUpperCase()).join('') || '?';
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};
function toast(msg, isErr) {
  document.querySelectorAll('.toast').forEach(x => x.remove());
  const t = document.createElement('div'); t.className = 'toast' + (isErr ? ' e' : ''); t.setAttribute('role', 'status'); t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), isErr ? 5000 : 2800);
}
function frErr(e) {
  const m = (e && (e.message || e.error_description)) || String(e);
  if (/Invalid login credentials/i.test(m)) return 'E-mail ou mot de passe incorrect. Si vous avez oublié votre mot de passe, utilisez « Mot de passe oublié ? » ci-dessous.';
  if (/Email not confirmed/i.test(m)) return 'Confirmez d\'abord votre adresse e-mail (lien reçu par e-mail).';
  if (/User already registered/i.test(m)) return 'Un compte existe déjà avec cet e-mail. Connectez-vous.';
  if (/Password should be at least/i.test(m)) return 'Le mot de passe doit contenir au moins 8 caractères.';
  if (/rate limit/i.test(m)) return 'Trop de tentatives. Patientez quelques minutes.';
  if (/Failed to fetch|NetworkError|network/i.test(m)) return 'Connexion impossible. Vérifiez votre réseau.';
  if (/row-level security|permission denied/i.test(m)) return 'Vous n\'avez pas les droits pour cette action.';
  if (/duplicate key.*invitations/i.test(m)) return 'Cette personne est déjà invitée.';
  return m;
}

/* ---------- État ---------- */
const S = {
  user: null, workspaces: [], ws: null, role: null,
  projects: [], activities: [], members: [], invitations: [], kpis: [], kpiValues: [],
  kf: { project: '', cat: '', gran: store.get('asap-gran', 'mois') },
  view: store.get('asap-view', 'dash'), projectId: null, boardMode: store.get('asap-board', 'board'),
  f: { q: '', project: '', status: '', resp: '', late: false },
  online: navigator.onLine, channel: null
};
const canEdit = () => ['owner', 'admin', 'member'].includes(S.role) && S.online;
const isAdmin = () => ['owner', 'admin'].includes(S.role) && S.online;

/* ---------- Client Supabase ---------- */
const CONFIGURED = !SUPABASE_URL.startsWith('__');
let RECOVERY = /type=recovery/.test(location.hash);
const URL_ERR = (location.hash.match(/error_description=([^&]+)/) || [])[1];
const sb = CONFIGURED && window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
  auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true }
}) : null;

/* =====================================================================
   AUTHENTIFICATION
   ===================================================================== */
function renderAuth(mode, msg) {
  mode = mode || 'login';
  const T = {
    login: ['Connexion', 'Accédez au suivi de vos projets.', 'Se connecter'],
    signup: ['Créer un compte', 'Utilisez l\'e-mail auquel vous avez été invité, ou créez l\'espace de votre entreprise.', 'Créer mon compte'],
    reset: ['Mot de passe oublié', 'Recevez un lien pour choisir un nouveau mot de passe.', 'Envoyer le lien'],
    newpass: ['Nouveau mot de passe', 'Choisissez votre nouveau mot de passe.', 'Enregistrer']
  }[mode];
  $('#app').innerHTML = '<div class="auth"><form class="auth-box" id="authForm" novalidate>' + LOGO_FULL +
    '<h1>' + T[0] + '</h1><p class="sub">' + T[1] + '</p>' +
    (mode === 'signup' ? '<label class="f"><span>Nom complet</span><input class="i" name="name" autocomplete="name" required maxlength="200"></label><label class="f"><span>Organisation</span><input class="i" name="org" autocomplete="organization" required maxlength="200" placeholder="Entreprise, ONG, institution…"></label>' : '') +
    (mode !== 'newpass' ? '<label class="f"><span>E-mail</span><input class="i" name="email" type="email" autocomplete="email" required></label>' : '') +
    (mode !== 'reset' ? '<label class="f"><span>Mot de passe</span><input class="i" name="password" type="password" minlength="8" autocomplete="' + (mode === 'login' ? 'current-password' : 'new-password') + '" required></label>' : '') +
    (mode !== 'newpass' && TURNSTILE_SITEKEY ? '<div id="tsBox" class="ts-box"></div>' : '') +
    '<div id="authMsg">' + (msg ? '<p class="' + (msg.ok ? 'ok' : 'err') + '">' + esc(msg.t) + '</p>' : '') + '</div>' +
    '<button class="btn primary" style="width:100%;margin-top:.4rem" type="submit">' + T[2] + '</button>' +
    '<div class="switch">' +
      (mode === 'login' ? 'Pas encore de compte ? <button type="button" data-m="signup">Créer un compte</button><br><button type="button" data-m="reset" style="margin-top:.5rem">Mot de passe oublié ?</button>' : '') +
      (mode === 'signup' || mode === 'reset' ? 'Déjà un compte ? <button type="button" data-m="login">Se connecter</button>' : '') +
    '</div>' +
    (mode === 'signup' ? '<p class="privacy-note">' + IC.lock + '<span><b>Accès sur validation.</b> Pour protéger les données de nos clients, chaque nouveau compte est vérifié puis activé manuellement par ASAP WORKPLAN. Vous recevrez un e-mail dès l\'activation.</span></p>' : '<p class="privacy-note">' + IC.lock + '<span><b>Données privées.</b> Chaque organisation dispose d\'un espace isolé : aucune autre organisation ne peut voir ses projets, activités ou indicateurs.</span></p>') +
    '<div class="switch"><a href="' + SITE_URL + '" style="color:var(--muted)">← Retour au site</a></div>' +
  '</form></div>';
  let tsToken = null, tsWidget = null;
  if (mode !== 'newpass' && TURNSTILE_SITEKEY) loadTurnstile().then(t => {
    if (t && $('#tsBox')) tsWidget = t.render('#tsBox', { sitekey: TURNSTILE_SITEKEY, theme: 'dark', language: 'fr',
      callback: tok => { tsToken = tok; }, 'expired-callback': () => { tsToken = null; }, 'error-callback': () => { tsToken = null; } });
  }).catch(() => { const b = $('#tsBox'); if (b) b.innerHTML = '<p class="err">La vérification anti-robot ne se charge pas. Désactivez un éventuel bloqueur de publicité puis rechargez.</p>'; });
  const tsReset = () => { tsToken = null; try { if (tsWidget != null) window.turnstile.reset(tsWidget); } catch (e) {} };
  document.querySelectorAll('[data-m]').forEach(b => b.onclick = () => renderAuth(b.dataset.m));
  $('#authForm').onsubmit = async e => {
    e.preventDefault();
    const fd = Object.fromEntries(new FormData(e.target));
    const box = $('#authMsg'), btn = e.target.querySelector('[type=submit]');
    const show = (t, ok) => box.innerHTML = '<p class="' + (ok ? 'ok' : 'err') + '">' + esc(t) + '</p>';
    if (fd.email !== undefined && !/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test((fd.email || '').trim())) return show('Saisissez une adresse e-mail valide.');
    if (fd.password !== undefined && (fd.password || '').length < 8) return show('Le mot de passe doit contenir au moins 8 caractères.');
    if (mode === 'signup' && !(fd.name || '').trim()) return show('Indiquez votre nom.');
    if (mode === 'signup' && !(fd.org || '').trim()) return show('Indiquez votre organisation.');
    if (mode !== 'newpass' && TURNSTILE_SITEKEY && !tsToken) return show('Merci de valider la vérification anti-robot ci-dessus.');
    const captcha = tsToken ? { captchaToken: tsToken } : {};
    btn.disabled = true;
    try {
      const email = (fd.email || '').trim().toLowerCase();
      if (mode === 'login') {
        const { error } = await sb.auth.signInWithPassword({ email, password: fd.password, options: captcha });
        if (error) throw error;
      } else if (mode === 'signup') {
        const { data, error } = await sb.auth.signUp({ email, password: fd.password,
          options: Object.assign({ data: { full_name: fd.name.trim(), organization: fd.org.trim() }, emailRedirectTo: location.href.split('#')[0] }, captcha) });
        if (error) throw error;
        try { await sb.functions.invoke('notify-admin', { body: { email } }); } catch (e) {}
        if (!data.session) return renderAuth('login', { ok: true, t: 'Demande de compte envoyée ! 1. Confirmez votre adresse avec le lien reçu par e-mail. 2. ASAP WORKPLAN vérifie et active votre compte : vous recevrez un e-mail de confirmation. Aucune donnée n\'est accessible avant cette activation.' });
      } else if (mode === 'reset') {
        const { error } = await sb.auth.resetPasswordForEmail(email, Object.assign({ redirectTo: location.href.split('#')[0] }, captcha));
        if (error) throw error;
        show('Si un compte existe pour cet e-mail, un lien vient de vous être envoyé.', true);
      } else if (mode === 'newpass') {
        const { error } = await sb.auth.updateUser({ password: fd.password });
        if (error) throw error;
        RECOVERY = false; toast('Mot de passe mis à jour.'); boot();
      }
    } catch (err) { show(frErr(err)); } finally { btn.disabled = false; tsReset(); }
  };
  const first = $('#authForm input'); if (first) first.focus();
}

/* =====================================================================
   CHARGEMENT DES DONNÉES
   ===================================================================== */
async function boot() {
  if (!CONFIGURED) {
    $('#app').innerHTML = '<div class="auth"><div class="auth-box">' + LOGO_FULL + '<h1>Bientôt disponible</h1><p class="sub">L\'application de suivi est en cours de mise en service. Revenez très vite.</p><a class="btn" href="' + SITE_URL + '">← Retour au site</a></div></div>';
    return;
  }
  if (!sb) { $('#app').innerHTML = '<div class="loading">Connexion impossible. Vérifiez votre réseau puis rechargez.</div>'; return; }
  const { data: { session } } = await sb.auth.getSession();
  if (RECOVERY && session) { history.replaceState(null, '', location.pathname); return renderAuth('newpass'); }
  if (URL_ERR) { history.replaceState(null, '', location.pathname); return renderAuth('login', { t: /expired|invalid/i.test(decodeURIComponent(URL_ERR)) ? 'Ce lien a expiré ou a déjà été utilisé. Connectez-vous, ou demandez un nouveau lien avec « Mot de passe oublié ».' : decodeURIComponent(URL_ERR.replace(/\+/g, ' ')) }); }
  if (session && location.hash.includes('access_token')) history.replaceState(null, '', location.pathname);
  if (!session) {
    const cached = store.get('asap-cache', null);
    if (!navigator.onLine && cached) return useCache(cached);
    return renderAuth('login');
  }
  S.user = session.user;
  if (!(await checkAccount())) return;
  await loadWorkspaces();
}

/* ---------- Validation du compte par ASAP WORKPLAN ---------- */
async function checkAccount() {
  try {
    const [{ data: prof, error }, adm] = await Promise.all([
      sb.from('profiles').select('status, full_name, organization').eq('id', S.user.id).maybeSingle(),
      sb.rpc('is_platform_admin')
    ]);
    if (error) throw error;
    S.account = prof || { status: 'pending' };
    S.isAdmin = !!(adm && adm.data);
    if (S.account.status !== 'approved') { store.set('asap-cache', null); renderPending(S.account.status); return false; }
    return true;
  } catch (e) {
    const cached = store.get('asap-cache', null);
    if (!navigator.onLine && cached && cached.user === S.user.id) { useCache(cached); return false; }
    $('#app').innerHTML = '<div class="loading"><p>' + esc(frErr(e)) + '</p><button class="btn" id="retry">Réessayer</button></div>';
    $('#retry').onclick = () => location.reload();
    return false;
  }
}
function renderPending(status) {
  const T = {
    pending: ['Compte en attente de validation', 'Merci pour votre inscription. Pour garantir la confidentialité des données de nos clients, chaque compte est vérifié et activé manuellement par ASAP WORKPLAN, généralement sous 24 h ouvrées.', 'Vous recevrez un e-mail dès que votre compte sera activé. D\'ici là, aucune donnée de la plateforme n\'est accessible depuis ce compte.'],
    rejected: ['Demande non retenue', 'Votre demande d\'accès n\'a pas été acceptée.', 'Si vous pensez qu\'il s\'agit d\'une erreur, contactez-nous depuis le site ASAP WORKPLAN.'],
    suspended: ['Compte suspendu', 'L\'accès de ce compte a été suspendu par ASAP WORKPLAN.', 'Aucune donnée n\'est accessible tant que le compte reste suspendu. Contactez-nous depuis le site pour plus d\'informations.']
  }[status] || ['Compte en attente', '', ''];
  $('#app').innerHTML = '<div class="auth"><div class="auth-box">' + LOGO_FULL +
    '<div class="pending-ic">' + (status === 'pending' ? IC.clock : IC.lock) + '</div>' +
    '<h1>' + T[0] + '</h1><p class="sub">' + T[1] + '</p><p class="sub">' + T[2] + '</p>' +
    '<p class="sub" style="font-size:.85rem">Compte : <b style="color:var(--text)">' + esc(S.user.email) + '</b></p>' +
    (status === 'pending' ? '<button class="btn primary" style="width:100%" id="recheck">Vérifier à nouveau</button>' : '') +
    '<div class="switch"><button type="button" id="lo2">Se déconnecter</button> · <a href="' + SITE_URL + '" style="color:var(--muted)">Retour au site</a></div></div></div>';
  const rc = $('#recheck'); if (rc) rc.onclick = () => boot();
  $('#lo2').onclick = logout;
}

let wsLoading = null;
function loadWorkspaces() { if (!wsLoading) wsLoading = _loadWorkspaces().finally(() => { wsLoading = null; }); return wsLoading; }
async function _loadWorkspaces() {
  try {
    await sb.rpc('accept_invitations');
    const { data, error } = await sb.from('workspace_members').select('role, workspace:workspaces(id,name)').eq('user_id', S.user.id);
    if (error) throw error;
    S.workspaces = (data || []).filter(r => r.workspace).map(r => ({ id: r.workspace.id, name: r.workspace.name, role: r.role }))
      .sort((a, b) => a.name.localeCompare(b.name, 'fr'));
    if (!S.workspaces.length) return renderOnboarding();
    const saved = store.get('asap-ws', null);
    const ws = S.workspaces.find(w => w.id === saved) || S.workspaces[0];
    await selectWorkspace(ws.id);
  } catch (e) {
    const cached = store.get('asap-cache', null);
    if (cached && cached.user === S.user.id) return useCache(cached);
    $('#app').innerHTML = '<div class="loading"><p>' + esc(frErr(e)) + '</p><button class="btn" onclick="location.reload()">Réessayer</button></div>';
  }
}

async function selectWorkspace(id) {
  const ws = S.workspaces.find(w => w.id === id);
  S.ws = ws; S.role = ws.role; store.set('asap-ws', id);
  await loadData();
  subscribe();
  render();
  if (S.isAdmin && !S.adm.loaded) loadAdmin().then(renderNavBadge).catch(() => {});
}

async function loadData() {
  const wid = S.ws.id;
  const q = [
    sb.from('projects').select('*').eq('workspace_id', wid).order('created_at'),
    sb.from('activities').select('*').eq('workspace_id', wid).order('position').order('created_at'),
    sb.from('workspace_members').select('*').eq('workspace_id', wid).order('joined_at'),
    sb.from('kpis').select('*').eq('workspace_id', wid).order('position').order('created_at'),
    sb.from('kpi_values').select('*').eq('workspace_id', wid).order('period_start')
  ];
  if (['owner', 'admin'].includes(S.role)) q.push(sb.from('invitations').select('*').eq('workspace_id', wid).is('accepted_at', null).order('created_at'));
  const res = await Promise.all(q);
  const errRes = res.find(r => r.error); if (errRes) throw errRes.error;
  S.projects = res[0].data; S.activities = res[1].data; S.members = res[2].data; S.kpis = res[3].data || []; S.kpiValues = res[4].data || []; S.invitations = res[5] ? res[5].data : [];
  store.set('asap-cache', { user: S.user.id, email: S.user.email, workspaces: S.workspaces, ws: S.ws, projects: S.projects, activities: S.activities, members: S.members, kpis: S.kpis, kpiValues: S.kpiValues, at: Date.now() });
}

function useCache(c) {
  S.user = S.user || { id: c.user, email: c.email };
  S.workspaces = c.workspaces; S.ws = c.ws; S.role = c.ws.role;
  S.projects = c.projects; S.activities = c.activities; S.members = c.members; S.kpis = c.kpis || []; S.kpiValues = c.kpiValues || []; S.invitations = [];
  S.online = false; S.cachedAt = c.at;
  render();
}

let reloadTimer = null;
function subscribe() {
  if (S.channel) sb.removeChannel(S.channel);
  const f = 'workspace_id=eq.' + S.ws.id;
  const again = () => { clearTimeout(reloadTimer); reloadTimer = setTimeout(async () => { try { await loadData(); render(true); } catch (e) {} }, 400); };
  S.channel = sb.channel('ws-' + S.ws.id)
    .on('postgres_changes', { event: '*', schema: 'public', table: 'activities', filter: f }, again)
    .on('postgres_changes', { event: '*', schema: 'public', table: 'projects', filter: f }, again)
    .on('postgres_changes', { event: '*', schema: 'public', table: 'kpis', filter: f }, again)
    .on('postgres_changes', { event: '*', schema: 'public', table: 'kpi_values', filter: f }, again)
    .subscribe();
}

async function logout() {
  try { if (S.channel) sb.removeChannel(S.channel); await sb.auth.signOut(); } catch (e) {}

/* ---------- Événements ---------- */
function bindMain() {
  const m = $('#main');
  m.onclick = e => {
    const t = e.target.closest('[data-act],[data-proj],[data-new-act],[data-new-proj],[data-edit-proj],[data-v2],[data-bm],[data-copy],[data-uninv],[data-rm],[data-kval],[data-kpi],[data-new-kpi],[data-kpis-of],[data-gran]');
    if (!t) return;
    if (t.dataset.act) return activityModal(S.activities.find(a => a.id === t.dataset.act));
    if (t.dataset.proj) return go('project', t.dataset.proj);
    if (t.hasAttribute('data-new-act')) return activityModal(null, t.dataset.newAct || (S.view === 'project' ? S.projectId : ''));
    if (t.hasAttribute('data-new-proj')) return projectModal();
    if (t.dataset.editProj) return projectModal(projOf(t.dataset.editProj));
    if (t.dataset.v2) return go(t.dataset.v2);
    if (t.dataset.bm) { S.boardMode = t.dataset.bm; store.set('asap-board', S.boardMode); return renderMain(); }
    if (t.dataset.copy) return copyInvite(t.dataset.copy);
    if (t.dataset.uninv) return cancelInvite(t.dataset.uninv);
    if (t.dataset.rm) return removeMember(t.dataset.rm);
    if (t.dataset.kval) return kpiDetail(S.kpis.find(k => k.id === t.dataset.kval), true);
    if (t.dataset.kpi) return kpiDetail(S.kpis.find(k => k.id === t.dataset.kpi));
    if (t.hasAttribute('data-new-kpi')) return kpiModal(null, S.kf.project);
    if (t.dataset.kpisOf) { S.kf.project = t.dataset.kpisOf; return go('kpis'); }
  };
  bindKpis(m);
  if (S.view === 'admin') bindAdmin(m);
  // Filtres
  const upd = () => { $('#actsOut').innerHTML = actsTable(filteredActs()); };
  const fq = $('#fq'); if (fq) {
    fq.oninput = () => { S.f.q = fq.value; upd(); };
    $('#fp').onchange = e => { S.f.project = e.target.value; upd(); };
    $('#fs').onchange = e => { S.f.status = e.target.value; upd(); };
    $('#fr').onchange = e => { S.f.resp = e.target.value; upd(); };
    $('#fl').onchange = e => { S.f.late = e.target.checked; upd(); };
    $('#csv').onclick = exportCsv;
  }
  // Glisser-déposer
  if (canEdit()) {
    m.querySelectorAll('.acard[draggable]').forEach(c => c.ondragstart = e => { e.dataTransfer.setData('text/plain', c.dataset.act); e.dataTransfer.effectAllowed = 'move'; });
    m.querySelectorAll('[data-col]').forEach(col => {
      col.ondragover = e => { e.preventDefault(); col.classList.add('drop'); };
      col.ondragleave = () => col.classList.remove('drop');
      col.ondrop = async e => {
        e.preventDefault(); col.classList.remove('drop');
        const a = S.activities.find(x => x.id === e.dataTransfer.getData('text/plain'));
        if (!a || a.status === col.dataset.col) return;
        const patch = { status: col.dataset.col }; if (patch.status === 'termine') patch.progress = 100;
        Object.assign(a, patch); renderMain();
        const { error } = await sb.from('activities').update(patch).eq('id', a.id);
        if (error) { toast(frErr(error), true); await loadData(); renderMain(); }
      };
    });
  }
  // Équipe
  const inv = $('#invForm'); if (inv) inv.onsubmit = invite;
  m.querySelectorAll('[data-role]').forEach(s => s.onchange = async () => {
    const { error } = await sb.from('workspace_members').update({ role: s.value }).eq('workspace_id', S.ws.id).eq('user_id', s.dataset.role);
    if (error) toast(frErr(error), true); else toast('Rôle mis à jour.');
  });
  const wr = $('#wsRename'); if (wr) wr.onsubmit = async e => {
    e.preventDefault(); const n = e.target.name.value.trim(); if (n.length < 2) return;
    const { error } = await sb.from('workspaces').update({ name: n }).eq('id', S.ws.id);
    if (error) return toast(frErr(error), true);
    S.ws.name = n; S.workspaces.find(w => w.id === S.ws.id).name = n; render(); toast('Espace renommé.');
  };
  const lv = $('#leaveWs'); if (lv) lv.onclick = async () => {
    if (!confirm('Quitter l\'espace « ' + S.ws.name + ' » ? Vous n\'aurez plus accès à ses projets.')) return;
    const { error } = await sb.from('workspace_members').delete().eq('workspace_id', S.ws.id).eq('user_id', S.user.id);
    if (error) return toast(frErr(error), true);
    store.set('asap-ws', null); loadWorkspaces();
  };
}

   FENÊTRES : projet, activité

function modal(html, wide) {
  const root = $('#modal-root');
  root.innerHTML = '<div class="modal" role="dialog" aria-modal="true"><div class="mbox' + (wide ? ' wide' : '') + '"><button class="mclose" aria-label="Fermer">×</button>' + html + '</div></div>';
  const close = () => { root.innerHTML = ''; document.removeEventListener('keydown', esc_); };
  const esc_ = e => { if (e.key === 'Escape') close(); };
  document.addEventListener('keydown', esc_);
  root.querySelector('.modal').onclick = e => { if (e.target.classList.contains('modal') || e.target.classList.contains('mclose')) close(); };
  const f = root.querySelector('input:not([type=hidden]),select,textarea'); if (f && window.innerWidth > 860) setTimeout(() => f.focus(), 30);
  return { el: root.querySelector('.mbox'), close };
}

function projectModal(p) {
  const ed = !!p; p = p || { name: '', description: '', start_date: '', end_date: '', status: 'actif', color: COLORS[S.projects.length % COLORS.length] };
  const { el, close } = modal('<h3>' + (ed ? 'Modifier le projet' : 'Nouveau projet') + '</h3><form id="pf">' +
    '<label class="f"><span>Nom du projet *</span><input class="i" name="name" required maxlength="160" value="' + esc(p.name) + '"></label>' +
    '<label class="f"><span>Description</span><textarea class="i" name="description" maxlength="2000">' + esc(p.description) + '</textarea></label>' +
    '<div class="row"><label class="f"><span>Début</span><input class="i" type="date" name="start_date" value="' + esc(p.start_date || '') + '"></label>' +
    '<label class="f"><span>Fin prévue</span><input class="i" type="date" name="end_date" value="' + esc(p.end_date || '') + '"></label></div>' +
    '<div class="row"><label class="f"><span>Statut</span><select class="i" name="status">' + Object.entries(PSTATUS).map(([k, l]) => '<option value="' + k + '"' + (p.status === k ? ' selected' : '') + '>' + l + '</option>').join('') + '</select></label>' +
    '<label class="f"><span>Couleur</span><select class="i" name="color">' + COLORS.map((c, i) => '<option value="' + c + '"' + (p.color === c ? ' selected' : '') + '>' + ['Orange', 'Vert', 'Bleu', 'Ambre', 'Violet', 'Rose'][i] + '</option>').join('') + '</select></label></div>' +
    '<p class="err" id="pfErr"></p><div class="mfoot">' + (ed && isAdmin() ? '<button type="button" class="btn danger" id="pDel">Supprimer</button>' : '') +
    '<div class="r"><button type="button" class="btn" id="pCancel">Annuler</button><button class="btn primary" type="submit">' + (ed ? 'Enregistrer' : 'Créer le projet') + '</button></div></div></form>');
  el.querySelector('#pCancel').onclick = close;
  el.querySelector('#pf').onsubmit = async e => {
    e.preventDefault();
    const d = Object.fromEntries(new FormData(e.target)); d.name = d.name.trim();
    if (d.name.length < 2) return el.querySelector('#pfErr').textContent = 'Le nom doit contenir au moins 2 caractères.';
    if (d.start_date && d.end_date && d.end_date < d.start_date) return el.querySelector('#pfErr').textContent = 'La date de fin est avant la date de début.';
    d.start_date = d.start_date || null; d.end_date = d.end_date || null;
    const btn = e.target.querySelector('[type=submit]'); btn.disabled = true;
    const r = ed ? await sb.from('projects').update(d).eq('id', p.id).select().single()
                 : await sb.from('projects').insert(Object.assign(d, { workspace_id: S.ws.id })).select().single();
    btn.disabled = false;
    if (r.error) return el.querySelector('#pfErr').textContent = frErr(r.error);
    if (ed) Object.assign(p, r.data); else S.projects.push(r.data);
    close(); toast(ed ? 'Projet enregistré.' : 'Projet créé.');
    if (!ed) go('project', r.data.id); else renderMain();
  };
  const del = el.querySelector('#pDel'); if (del) del.onclick = async () => {
    if (!confirm('Supprimer le projet « ' + p.name + ' » et ses ' + actsOf(p.id).length + ' activités ? Cette action est définitive.')) return;
    const { error } = await sb.from('projects').delete().eq('id', p.id);
    if (error) return toast(frErr(error), true);
    S.projects = S.projects.filter(x => x.id !== p.id); S.activities = S.activities.filter(a => a.project_id !== p.id);
    close(); toast('Projet supprimé.'); go('projects');
  };
}

function activityModal(a, projectId) {
  if (!S.projects.length && !a) { toast('Créez d\'abord un projet.'); return projectModal(); }
  const ed = !!a, ro = !canEdit();
  a = a || { project_id: projectId || (S.f.project || S.projects[0].id), title: '', description: '', phase: '', responsible: '', start_date: '', due_date: '', status: 'a_faire', priority: 'normale', progress: 0 };
  const dis = ro ? ' disabled' : '';
  const html = '<h3>' + (ed ? esc(a.title) : 'Nouvelle activité') + '</h3><form id="af">' +
    '<label class="f"><span>Intitulé *</span><input class="i" name="title" required maxlength="200" value="' + esc(a.title) + '"' + dis + '></label>' +
    '<div class="row"><label class="f"><span>Projet</span><select class="i" name="project_id"' + dis + '>' + S.projects.map(p => '<option value="' + p.id + '"' + (a.project_id === p.id ? ' selected' : '') + '>' + esc(p.name) + '</option>').join('') + '</select></label>' +
    '<label class="f"><span>Phase / lot</span><input class="i" name="phase" maxlength="80" list="phases" value="' + esc(a.phase) + '"' + dis + '><datalist id="phases">' + [...new Set(S.activities.map(x => x.phase).filter(Boolean))].map(x => '<option value="' + esc(x) + '">').join('') + '</datalist></label></div>' +
    '<div class="row"><label class="f"><span>Responsable</span><input class="i" name="responsible" maxlength="120" list="resps" value="' + esc(a.responsible) + '"' + dis + '><datalist id="resps">' + [...new Set(responsibles().concat(S.members.map(m => m.display_name || m.email).filter(Boolean)))].map(x => '<option value="' + esc(x) + '">').join('') + '</datalist></label>' +
    '<label class="f"><span>Priorité</span><select class="i" name="priority"' + dis + '>' + Object.entries(PRIO).map(([k, l]) => '<option value="' + k + '"' + (a.priority === k ? ' selected' : '') + '>' + l + '</option>').join('') + '</select></label></div>' +
    '<div class="row"><label class="f"><span>Début</span><input class="i" type="date" name="start_date" value="' + esc(a.start_date || '') + '"' + dis + '></label>' +
    '<label class="f"><span>Échéance</span><input class="i" type="date" name="due_date" value="' + esc(a.due_date || '') + '"' + dis + '></label></div>' +
    '<div class="row"><label class="f"><span>Statut</span><select class="i" name="status"' + dis + '>' + Object.entries(STATUS).map(([k, l]) => '<option value="' + k + '"' + (a.status === k ? ' selected' : '') + '>' + l + '</option>').join('') + '</select></label>' +
    '<label class="f"><span>Avancement</span><div class="range"><input type="range" name="progress" min="0" max="100" step="5" value="' + a.progress + '"' + dis + '><output>' + a.progress + '%</output></div></label></div>' +
    '<label class="f"><span>Description</span><textarea class="i" name="description" maxlength="4000"' + dis + '>' + esc(a.description) + '</textarea></label>' +
    '<p class="err" id="afErr"></p>' +
    (ro ? '' : '<div class="mfoot">' + (ed ? '<button type="button" class="btn danger" id="aDel">Supprimer</button>' : '') + '<div class="r"><button type="button" class="btn" id="aCancel">Annuler</button><button class="btn primary" type="submit">' + (ed ? 'Enregistrer' : 'Ajouter') + '</button></div></div>') +
    '</form>' +
    (ed ? '<div class="sep"></div><h3 style="font-size:1rem;margin-bottom:.6rem">Comptes rendus d\'avancement</h3>' +
      (ro ? '' : '<form id="uf"><textarea class="i" name="note" placeholder="Ce qui a été fait, difficultés, prochaines étapes…" maxlength="2000" style="min-height:70px"></textarea><div style="display:flex;justify-content:flex-end;margin-top:.5rem"><button class="btn sm" type="submit">Ajouter le compte rendu</button></div></form>') +
      '<div class="timeline" id="tl"><div style="color:var(--muted);font-size:.85rem">Chargement…</div></div>' : '');
  const { el, close } = modal(html, true);
  const rng = el.querySelector('[name=progress]'), out = el.querySelector('output'), st = el.querySelector('[name=status]');
  rng.oninput = () => { out.textContent = rng.value + '%'; if (rng.value === '100' && st.value !== 'termine') st.value = 'termine'; else if (+rng.value > 0 && st.value === 'a_faire') st.value = 'en_cours'; };
  st.onchange = () => { if (st.value === 'termine') { rng.value = 100; out.textContent = '100%'; } };
  if (!ro) {
    el.querySelector('#aCancel').onclick = close;
    el.querySelector('#af').onsubmit = async e => {
      e.preventDefault();
      const d = Object.fromEntries(new FormData(e.target)); d.title = d.title.trim(); d.progress = +d.progress;
      if (!d.title) return el.querySelector('#afErr').textContent = 'Indiquez un intitulé.';
      if (d.start_date && d.due_date && d.due_date < d.start_date) return el.querySelector('#afErr').textContent = 'L\'échéance est avant la date de début.';
      d.start_date = d.start_date || null; d.due_date = d.due_date || null;
      const btn = e.target.querySelector('[type=submit]'); btn.disabled = true;
      const r = ed ? await sb.from('activities').update(d).eq('id', a.id).select().single()

      btn.disabled = false;

      if (ed) Object.assign(a, r.data); else S.activities.push(r.data);
      close(); toast(ed ? 'Activité enregistrée.' : 'Activité ajoutée.'); renderMain();
    };
    const del = el.querySelector('#aDel'); if (del) del.onclick = async () => {
      if (!confirm('Supprimer cette activité et ses comptes rendus ?')) return;
      const { error } = await sb.from('activities').delete().eq('id', a.id);
      if (error) return toast(frErr(error), true);
      S.activities = S.activities.filter(x => x.id !== a.id); close(); toast('Activité supprimée.'); renderMain();
    };
  }
  if (ed) loadUpdates(a, el);
}

async function loadUpdates(a, el) {
  const tl = el.querySelector('#tl');
  const draw = list => tl.innerHTML = list.length ? list.map(u => '<div class="tl"><small>' + fdt(u.created_at) + ' · ' + esc(u.author_name || 'Membre') + (u.progress != null ? ' · ' + u.progress + '%' : '') + (u.status ? ' · ' + STATUS[u.status] : '') + '</small><p>' + esc(u.note) + '</p></div>').join('') : '<div style="color:var(--muted);font-size:.85rem">Aucun compte rendu pour l\'instant.</div>';
  if (!S.online) return tl.innerHTML = '<div style="color:var(--muted);font-size:.85rem">Disponible une fois connecté.</div>';
  const { data, error } = await sb.from('activity_updates').select('*').eq('activity_id', a.id).order('created_at', { ascending: false });
  if (error) return tl.innerHTML = '<p class="err">' + esc(frErr(error)) + '</p>';
  draw(data);
  const uf = el.querySelector('#uf'); if (uf) uf.onsubmit = async e => {
    e.preventDefault();
    const note = uf.note.value.trim(); if (!note) return;
    const form = el.querySelector('#af');
    const prog = +form.progress.value, status = form.status.value;
    const me = S.members.find(m => m.user_id === S.user.id);
    const author = (S.user.user_metadata && S.user.user_metadata.full_name) || (me && me.display_name) || S.user.email;
    const btn = uf.querySelector('button'); btn.disabled = true;
    const r = await sb.from('activity_updates').insert({ activity_id: a.id, workspace_id: S.ws.id, note, progress: prog, status, author_name: author }).select().single();
    if (!r.error && (prog !== a.progress || status !== a.status)) {
      const u = await sb.from('activities').update({ progress: prog, status }).eq('id', a.id).select().single();
      if (!u.error) Object.assign(a, u.data);
    }
    btn.disabled = false;
    if (r.error) return toast(frErr(r.error), true);
    uf.reset(); data.unshift(r.data); draw(data); toast('Compte rendu ajouté.'); renderMain();
  };
}

function newWorkspaceModal() {
  const { el, close } = modal('<h3>Nouvel espace</h3><form id="nw"><label class="f"><span>Nom de l\'entreprise / organisation</span><input class="i" name="name" required maxlength="120"></label><p class="err" id="nwErr"></p><div class="mfoot"><div class="r"><button type="button" class="btn" id="nwC">Annuler</button><button class="btn primary" type="submit">Créer</button></div></div></form>');

  el.querySelector('#nw').onsubmit = async e => {
    e.preventDefault(); const n = e.target.name.value.trim();
    if (n.length < 2) return el.querySelector('#nwErr').textContent = '2 caractères minimum.';
    const { data, error } = await sb.rpc('create_workspace', { ws_name: n });
    if (error) return el.querySelector('#nwErr').textContent = frErr(error);
    close(); store.set('asap-ws', data); loadWorkspaces();
  };
}

/* ---------- Équipe : actions ---------- */
async function invite(e) {
  e.preventDefault();
  const email = e.target.email.value.trim().toLowerCase(), role = e.target.role.value;
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)) return toast('Adresse e-mail invalide.', true);
  if (S.members.some(m => (m.email || '').toLowerCase() === email)) return toast('Cette personne est déjà membre.', true);
  const { data, error } = await sb.from('invitations').insert({ workspace_id: S.ws.id, email, role }).select().single();
  if (error) return toast(frErr(error), true);
  S.invitations.push(data); renderMain(); copyInvite(email);
}
function inviteText(email) {
  const url = location.href.split('#')[0].split('?')[0];
  return 'Bonjour,\n\nVous êtes invité(e) à suivre les projets de « ' + S.ws.name + ' » sur ASAP WORKPLAN.\n\n1. Ouvrez : ' + url + '\n2. Cliquez sur « Créer un compte » avec cette adresse : ' + email + '\n3. Vous pouvez installer l\'application sur votre ordinateur et votre téléphone.\n\nÀ bientôt !';
}
async function copyInvite(email) {
  const txt = inviteText(email);
  try { await navigator.clipboard.writeText(txt); toast('Invitation copiée : collez-la dans un e-mail ou WhatsApp.'); }
  catch (e) { modal('<h3>Message d\'invitation</h3><textarea class="i" style="min-height:200px" readonly>' + esc(txt) + '</textarea><p style="color:var(--muted);font-size:.8rem;margin-top:.6rem">Copiez ce texte et envoyez-le à ' + esc(email) + '.</p>'); }
}
async function cancelInvite(id) {
  const { error } = await sb.from('invitations').delete().eq('id', id);

/* =====================================================================
   INDICATEURS (KPI)
   ===================================================================== */
const KCAT = {
  intrant:   { l: 'Intrants',   d: 'Ressources mobilisées : budget, personnel, matériel', c: '#4FC3F7' },
  processus: { l: 'Processus',  d: 'Mise en œuvre des activités prévues', c: '#b388ff' },
  extrant:   { l: 'Extrants',   d: 'Produits directs : formations, livrables, services', c: '#ff4d1c' },
  resultat:  { l: 'Résultats',  d: 'Effets à court et moyen terme sur les bénéficiaires', c: '#00e5a0' },
  impact:    { l: 'Impact',     d: 'Changements durables à long terme', c: '#f5a623' }
};
const KTYPE = { nombre: 'Nombre', pourcentage: 'Pourcentage', montant: 'Montant', duree: 'Durée' };
const KFREQ = { hebdomadaire: 'Hebdomadaire', mensuel: 'Mensuelle', annuel: 'Annuelle' };
const KAGG = { somme: 'Somme (cumul)', moyenne: 'Moyenne', dernier: 'Dernière valeur' };
const KAGG_HINT = { somme: 'Les valeurs s\'additionnent (ex. : personnes formées, dépenses).', moyenne: 'On fait la moyenne des valeurs (ex. : taux de satisfaction).', dernier: 'Seule la valeur la plus récente compte (ex. : stock, effectif).' };
const GRAN = { semaine: 'Semaine', mois: 'Mois', annee: 'Année' };
const GRAN_N = { semaine: 12, mois: 12, annee: 5 };
const FREQ2GRAN = { hebdomadaire: 'semaine', mensuel: 'mois', annuel: 'annee' };
const GRAN_ORDER = { semaine: 0, mois: 1, annee: 2 };
const MOIS = ['janv.', 'févr.', 'mars', 'avr.', 'mai', 'juin', 'juil.', 'août', 'sept.', 'oct.', 'nov.', 'déc.'];
const MOIS_L = ['Janvier', 'Février', 'Mars', 'Avril', 'Mai', 'Juin', 'Juillet', 'Août', 'Septembre', 'Octobre', 'Novembre', 'Décembre'];

/* ---------- Périodes ---------- */
const ymd = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
function periodStart(dateStr, gran) {
  const d = typeof dateStr === 'string' ? pd(dateStr) : new Date(dateStr.getFullYear(), dateStr.getMonth(), dateStr.getDate());
  if (gran === 'semaine') { const w = (d.getDay() + 6) % 7; d.setDate(d.getDate() - w); return ymd(d); }
  if (gran === 'mois') return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-01';
  return d.getFullYear() + '-01-01';
}
function isoWeek(s) {
  const d = pd(s); const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  const day = t.getUTCDay() || 7; t.setUTCDate(t.getUTCDate() + 4 - day);
  const y0 = new Date(Date.UTC(t.getUTCFullYear(), 0, 1));
  return Math.ceil(((t - y0) / 86400000 + 1) / 7);
}
function periodLabel(s, gran, long) {
  const d = pd(s);
  if (gran === 'semaine') return long ? 'Semaine ' + isoWeek(s) + ' (du ' + d.getDate() + ' ' + MOIS[d.getMonth()] + ' ' + d.getFullYear() + ')' : 'S' + isoWeek(s);
  if (gran === 'mois') return long ? MOIS_L[d.getMonth()] + ' ' + d.getFullYear() : MOIS[d.getMonth()] + (d.getMonth() === 0 ? ' ' + String(d.getFullYear()).slice(2) : '');
  return String(d.getFullYear());
}
function lastPeriods(gran, n) {
  const out = []; const d = today();
  let cur = pd(periodStart(d, gran));
  for (let i = 0; i < n; i++) {
    out.unshift(ymd(cur));
    if (gran === 'semaine') cur.setDate(cur.getDate() - 7);
    else if (gran === 'mois') cur = new Date(cur.getFullYear(), cur.getMonth() - 1, 1);
    else cur = new Date(cur.getFullYear() - 1, 0, 1);
  }
  return out;
}

/* ---------- Calculs ---------- */
const valsOf = kid => S.kpiValues.filter(v => v.kpi_id === kid).sort((a, b) => a.period_start.localeCompare(b.period_start));
const num = v => v == null || v === '' ? null : Number(v);
function combine(k, list) {
  if (!list.length) return null;
  if (k.aggregation === 'somme') return list.reduce((s, v) => s + Number(v.value), 0);
  if (k.aggregation === 'moyenne') return list.reduce((s, v) => s + Number(v.value), 0) / list.length;
  return Number(list.reduce((a, b) => (a.period_start >= b.period_start ? a : b)).value);
}
function series(k, gran, n) {
  const vals = valsOf(k.id), keys = lastPeriods(gran, n), map = {};
  vals.forEach(v => { const key = periodStart(v.period_start, gran); (map[key] = map[key] || []).push(v); });
  let run = k.aggregation === 'somme' ? vals.filter(v => periodStart(v.period_start, gran) < keys[0]).reduce((s, v) => s + Number(v.value), 0) : null;
  return keys.map(key => {
    const val = map[key] ? combine(k, map[key]) : null;
    if (run != null && val != null) run += val;
    return { key, val, cum: run != null ? run : null };
  });
}
function kpiCurrent(k) {
  const vals = valsOf(k.id);
  if (!vals.length) return null;
  if (k.aggregation === 'somme') return vals.reduce((s, v) => s + Number(v.value), 0);
  if (k.aggregation === 'moyenne') {
    const g = FREQ2GRAN[k.frequency]; const lastKey = periodStart(vals[vals.length - 1].period_start, g);
    return combine(k, vals.filter(v => periodStart(v.period_start, g) === lastKey));
  }
  return Number(vals[vals.length - 1].value);
}
function kpiProgress(k, cur) {
  const t = num(k.target), b = num(k.baseline);
  if (cur == null || t == null) return null;
  let p;
  if (k.direction === 'baisse') {
    if (b != null && b !== t) p = (b - cur) / (b - t); else p = cur <= t ? 1 : t / cur;
  } else {
    if (b != null && b !== t) p = (cur - b) / (t - b); else p = t ? cur / t : 0;
  }
  return Math.max(0, Math.min(p, 1.5));
}
function expectedProgress(k) {
  const p = projOf(k.project_id);
  if (!p || !p.start_date || !p.end_date || k.aggregation !== 'somme') return null;
  const s = pd(p.start_date), e = pd(p.end_date), t = today();
  if (e <= s) return null;
  return Math.max(0, Math.min((t - s) / (e - s), 1));
}
function kpiStatus(k) {
  const cur = kpiCurrent(k), pr = kpiProgress(k, cur);
  if (cur == null) return { key: 'vide', l: 'Aucune donnée', c: 'var(--muted)', pr: null, cur };
  if (pr == null) return { key: 'suivi', l: 'Sans cible', c: 'var(--blue)', pr: null, cur };
  if (pr >= 1) return { key: 'atteint', l: 'Cible atteinte', c: 'var(--accent2)', pr, cur };
  const exp = expectedProgress(k);
  const gap = exp != null ? pr - exp : null;
  if (gap != null ? gap >= -0.05 : pr >= 0.7) return { key: 'ok', l: 'En bonne voie', c: 'var(--blue)', pr, cur };
  if (gap != null ? gap >= -0.2 : pr >= 0.4) return { key: 'risque', l: 'À surveiller', c: 'var(--warn)', pr, cur };
  return { key: 'retard', l: 'En retard', c: 'var(--red)', pr, cur };
}
function missingCurrent(k) {
  const g = FREQ2GRAN[k.frequency];
  const prev = lastPeriods(g, 2)[0];             // la période qui vient de se terminer
  return !valsOf(k.id).some(v => periodStart(v.period_start, g) >= prev);
}
function fmtNum(v, k, short) {
  if (v == null || isNaN(v)) return '-';
  const dec = k.value_type === 'pourcentage' || k.aggregation === 'moyenne' ? 1 : (Math.abs(v) < 10 && v % 1 ? 2 : 0);
  let s;
  if (short && Math.abs(v) >= 1e6) s = (v / 1e6).toLocaleString('fr-FR', { maximumFractionDigits: 1 }) + ' M';
  else if (short && Math.abs(v) >= 1e4) s = (v / 1e3).toLocaleString('fr-FR', { maximumFractionDigits: 1 }) + ' k';
  else s = v.toLocaleString('fr-FR', { maximumFractionDigits: dec });
  const u = k.value_type === 'pourcentage' ? '%' : (k.unit || '');
  return s + (u ? (u === '%' ? ' %' : ' ' + u) : '');
}

/* ---------- Graphique SVG ---------- */
function kpiChart(k, gran, opts) {
  opts = opts || {};
  const n = GRAN_N[gran], data = series(k, gran, n);
  const cum = opts.cum && k.aggregation === 'somme';
  const vals = data.map(d => cum ? d.cum : d.val);
  const t = num(k.target), showT = t != null && (cum || k.aggregation !== 'somme');
  const max = Math.max(1, ...vals.filter(v => v != null), showT ? t : 0) * 1.12;
  const W = opts.w || 320, H = opts.h || 90, pl = opts.axis ? 44 : 2, pb = opts.axis ? 22 : 2, pt = 6;
  const iw = W - pl - 4, ih = H - pb - pt, bw = iw / n;
  const y = v => pt + ih - (v / max) * ih;
  const cat = KCAT[k.category] || KCAT.extrant;
  let g = '';
  if (opts.axis) {
    [0, 0.5, 1].forEach(f => { const v = max / 1.12 * f, yy = y(v);
      g += '<line x1="' + pl + '" x2="' + (W - 4) + '" y1="' + yy + '" y2="' + yy + '" stroke="rgba(255,255,255,.07)"/><text x="' + (pl - 6) + '" y="' + (yy + 3) + '" text-anchor="end" font-size="10" fill="#8a8a8a">' + esc(fmtNum(v, Object.assign({}, k, { unit: '' }), true)) + '</text>'; });
  }
  if (cum) {
    const pts = data.map((d, i) => d.cum != null ? (pl + i * bw + bw / 2) + ',' + y(d.cum) : null).filter(Boolean);
    if (pts.length) g += '<polyline points="' + pts.join(' ') + '" fill="none" stroke="' + cat.c + '" stroke-width="2.2" stroke-linejoin="round"/>' + data.map((d, i) => d.cum != null ? '<circle cx="' + (pl + i * bw + bw / 2) + '" cy="' + y(d.cum) + '" r="3" fill="' + cat.c + '"><title>' + esc(periodLabel(d.key, gran, true) + ' : ' + fmtNum(d.cum, k)) + '</title></circle>' : '').join('');
  } else {
    data.forEach((d, i) => {
      if (d.val == null) { g += '<rect x="' + (pl + i * bw + bw * .18) + '" y="' + (pt + ih - 2) + '" width="' + bw * .64 + '" height="2" fill="rgba(255,255,255,.08)" rx="1"/>'; return; }
      const h = Math.max(2, (d.val / max) * ih);
      g += '<rect x="' + (pl + i * bw + bw * .18) + '" y="' + (pt + ih - h) + '" width="' + bw * .64 + '" height="' + h + '" fill="' + cat.c + '" opacity="' + (i === n - 1 ? 1 : .75) + '" rx="2"><title>' + esc(periodLabel(d.key, gran, true) + ' : ' + fmtNum(d.val, k)) + '</title></rect>';
    });
  }
  if (showT) g += '<line x1="' + pl + '" x2="' + (W - 4) + '" y1="' + y(t) + '" y2="' + y(t) + '" stroke="#f5f2ee" stroke-dasharray="4 4" opacity=".55"/>' + (opts.axis ? '<text x="' + (W - 6) + '" y="' + (y(t) - 5) + '" text-anchor="end" font-size="10" fill="#f5f2ee" opacity=".8">Cible ' + esc(fmtNum(t, k, true)) + '</text>' : '');
  if (opts.axis) data.forEach((d, i) => { if (n <= 12 || i % 2 === 0) g += '<text x="' + (pl + i * bw + bw / 2) + '" y="' + (H - 6) + '" text-anchor="middle" font-size="10" fill="#8a8a8a">' + esc(periodLabel(d.key, gran)) + '</text>'; });
  return '<svg class="kchart" viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none" role="img" aria-label="Évolution de ' + esc(k.name) + '">' + g + '</svg>';
}

/* ---------- Vue Indicateurs ---------- */
function kpisFiltered() {
  return S.kpis.filter(k => (!S.kf.project || k.project_id === S.kf.project) && (!S.kf.cat || k.category === S.kf.cat));
}
function kpiTile(k) {
  const st = kpiStatus(k), cat = KCAT[k.category];
  const last = valsOf(k.id).slice(-1)[0];
  const miss = canEdit() && missingCurrent(k);
  return '<div class="ktile" data-kpi="' + k.id + '" tabindex="0" role="button" style="--kc:' + cat.c + '">' +
    '<div class="kt-top"><span class="kt-cat">' + esc(cat.l) + '</span><span class="kpill" style="color:' + st.c + '">' + esc(st.l) + '</span></div>' +
    '<h4>' + esc(k.name) + '</h4>' +
    (S.kf.project ? '' : '<div class="kt-proj">' + esc((projOf(k.project_id) || {}).name || '') + '</div>') +
    '<div class="kt-val"><b>' + esc(fmtNum(st.cur, k)) + '</b>' + (num(k.target) != null ? '<span>/ cible ' + esc(fmtNum(num(k.target), k)) + '</span>' : '') + '</div>' +
    '<div class="bar"><i style="width:' + Math.min(100, Math.round((st.pr || 0) * 100)) + '%;background:' + st.c + '"></i></div>' +
    '<div class="kt-chart">' + kpiChart(k, S.kf.gran) + '</div>' +
    '<div class="kt-foot"><span>' + (last ? 'Dernière saisie : ' + esc(periodLabel(last.period_start, FREQ2GRAN[k.frequency], true)) : 'Aucune valeur saisie') + '</span>' +
    (canEdit() ? '<button class="btn sm' + (miss ? ' primary' : '') + '" data-kval="' + k.id + '">' + (miss ? 'À saisir' : 'Saisir') + '</button>' : '') + '</div></div>';
}
function viewKpis() {
  const list = kpisFiltered();
  const sts = list.map(k => kpiStatus(k).key);
  const cnt = s => sts.filter(x => x === s).length;
  const toSeize = canEdit() ? list.filter(missingCurrent).length : 0;
  const head = '<div class="top"><div><div class="crumb">' + esc(S.ws.name) + '</div><h2>Indicateurs</h2></div><div class="actions">' +
    (S.kpis.length ? '<button class="btn" id="kcsv">' + IC.dl + 'Exporter</button>' : '') +
    (canEdit() && S.projects.length ? '<button class="btn primary" data-new-kpi>' + IC.plus + 'Indicateur</button>' : '') + '</div></div>';
  const filters = '<div class="filters"><select class="i" id="kfp" aria-label="Projet"><option value="">Tous les projets</option>' + S.projects.map(p => '<option value="' + p.id + '"' + (S.kf.project === p.id ? ' selected' : '') + '>' + esc(p.name) + '</option>').join('') + '</select>' +
    '<select class="i" id="kfc" aria-label="Type d\'indicateur"><option value="">Tous les types d\'indicateurs</option>' + Object.entries(KCAT).map(([k, c]) => '<option value="' + k + '"' + (S.kf.cat === k ? ' selected' : '') + '>' + c.l + '</option>').join('') + '</select>' +
    '<div class="view-toggle" role="group" aria-label="Période">' + Object.entries(GRAN).map(([g, l]) => '<button data-gran="' + g + '" class="' + (S.kf.gran === g ? 'on' : '') + '">' + l + '</button>').join('') + '</div></div>';
  if (!S.projects.length) return head + '<div class="empty">Créez d\'abord un projet, puis ajoutez-lui ses indicateurs.</div>';
  if (!S.kpis.length) return head + '<div class="card kintro"><h3>Suivez les indicateurs de vos projets</h3><p>Définissez pour chaque projet ses indicateurs de performance : intrants, processus, extrants, résultats et impact. Saisissez les valeurs chaque semaine, chaque mois ou chaque année, et suivez l\'évolution par rapport à la cible dans un tableau de bord généré automatiquement.</p>' +
    '<div class="kex"><div><b>Extrant</b><span>Nombre de personnes formées · somme · mensuel · cible 500</span></div><div><b>Résultat</b><span>Taux d\'adoption des outils · moyenne · mensuel · cible 80 %</span></div><div><b>Intrant</b><span>Budget dépensé · somme · mensuel · cible 25 000 000 FCFA</span></div></div>' +
    (canEdit() ? '<button class="btn primary" data-new-kpi>' + IC.plus + 'Créer le premier indicateur</button>' : '') + '</div>';
  const sum = '<div class="kpis k5"><div class="kpi"><div class="v">' + list.length + '</div><div class="l">Indicateurs suivis</div></div>' +
    '<div class="kpi green"><div class="v">' + cnt('atteint') + '</div><div class="l">Cible atteinte</div></div>' +
    '<div class="kpi"><div class="v" style="color:var(--blue)">' + cnt('ok') + '</div><div class="l">En bonne voie</div></div>' +
    '<div class="kpi red"><div class="v">' + (cnt('risque') + cnt('retard')) + '</div><div class="l">À surveiller ou en retard</div></div>' +
    '<div class="kpi orange"><div class="v">' + toSeize + '</div><div class="l">Valeurs à saisir</div></div></div>';
  const groups = Object.keys(KCAT).map(cat => {
    const ks = list.filter(k => k.category === cat);
    if (!ks.length) return '';
    return '<section class="kgroup"><div class="kg-h"><span class="kg-dot" style="background:' + KCAT[cat].c + '"></span><h3>' + KCAT[cat].l + '</h3><span class="kg-d">' + esc(KCAT[cat].d) + '</span><span class="mono kg-n">' + ks.length + '</span></div>' +
      '<div class="kgrid">' + ks.map(kpiTile).join('') + '</div></section>';
  }).join('');
  return head + filters + sum + (groups || '<div class="empty">Aucun indicateur pour ce filtre.</div>') +
    '<p class="khint">Graphiques : ' + GRAN_N[S.kf.gran] + ' dernières périodes, regroupées par ' + GRAN[S.kf.gran].toLowerCase() + '. Survolez une barre pour voir sa valeur. La ligne pointillée indique la cible.</p>';
}

/* ---------- Fenêtre : définir un indicateur ---------- */

    '<div class="row"><label class="f"><span>Fréquence de collecte</span>' + sel('frequency', KFREQ, k.frequency) + '</label>' +

    '<label class="f"><span>Définition / mode de calcul détaillé</span><textarea class="i" name="description" maxlength="2000" placeholder="Source des données, méthode de calcul, précisions…">' + esc(k.description || '') + '</textarea></label>' +
    '<p class="err" id="kfErr"></p><div class="mfoot">' + (ed ? '<button type="button" class="btn danger" id="kDel">Supprimer</button>' : '') +
