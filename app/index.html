                 : await sb.from('kpis').insert(Object.assign(d, { workspace_id: S.ws.id, position: S.kpis.length })).select().single();
    btn.disabled = false;
    if (r.error) return el.querySelector('#kfErr').textContent = frErr(r.error);
    if (ed) Object.assign(k, r.data); else S.kpis.push(r.data);
    close(); toast(ed ? 'Indicateur enregistré.' : 'Indicateur créé. Saisissez maintenant ses premières valeurs.');
    if (S.view !== 'kpis') go('kpis'); else renderMain();
    if (!ed) kpiDetail(r.data);
  };
  const del = el.querySelector('#kDel'); if (del) del.onclick = async () => {
    if (!confirm('Supprimer l\'indicateur « ' + k.name + ' » et ses ' + valsOf(k.id).length + ' valeurs ? Cette action est définitive.')) return;
    const { error } = await sb.from('kpis').delete().eq('id', k.id);
    if (error) return toast(frErr(error), true);
    S.kpis = S.kpis.filter(x => x.id !== k.id); S.kpiValues = S.kpiValues.filter(v => v.kpi_id !== k.id);
    close(); toast('Indicateur supprimé.'); renderMain();
  };
}

/* ---------- Fenêtre : détail d'un indicateur + saisie ---------- */
function periodInput(k, cur) {
  const d = cur ? pd(cur) : today(), y = d.getFullYear();
  if (k.frequency === 'hebdomadaire') return '<label class="f"><span>Semaine (choisissez un jour)</span><input class="i" type="date" name="pdate" value="' + ymd(d) + '" required></label>';
  if (k.frequency === 'mensuel') return '<div class="row"><label class="f"><span>Mois</span><select class="i" name="pmonth">' + MOIS_L.map((m, i) => '<option value="' + i + '"' + (i === d.getMonth() ? ' selected' : '') + '>' + m + '</option>').join('') + '</select></label><label class="f"><span>Année</span><input class="i" type="number" name="pyear" min="2000" max="2100" value="' + y + '" required></label></div>';
  return '<label class="f"><span>Année</span><input class="i" type="number" name="pyear" min="2000" max="2100" value="' + y + '" required></label>';
}
function readPeriod(k, f) {
  if (k.frequency === 'hebdomadaire') return f.pdate.value ? periodStart(f.pdate.value, 'semaine') : null;
  const y = parseInt(f.pyear.value, 10); if (!(y >= 2000 && y <= 2100)) return null;
  if (k.frequency === 'mensuel') return y + '-' + String(+f.pmonth.value + 1).padStart(2, '0') + '-01';
  return y + '-01-01';
}
function kpiDetail(k, focusValue) {
  const g0 = FREQ2GRAN[k.frequency];
  let gran = GRAN_ORDER[S.kf.gran] >= GRAN_ORDER[g0] ? S.kf.gran : g0, cumMode = k.aggregation === 'somme';
  const cat = KCAT[k.category], p = projOf(k.project_id);
  const { el, close } = modal('<div class="cours-cat mono" style="color:' + cat.c + '">' + esc(cat.l) + ' · ' + esc(p ? p.name : '') + '</div><h3>' + esc(k.name) + '</h3>' +
    (k.description ? '<p class="kdesc">' + esc(k.description) + '</p>' : '') +
    '<div class="kmeta"><span>' + KTYPE[k.value_type] + (k.unit ? ' (' + esc(k.unit) + ')' : '') + '</span><span>Collecte ' + KFREQ[k.frequency].toLowerCase() + '</span><span>' + KAGG[k.aggregation] + '</span><span>' + (k.direction === 'baisse' ? 'À diminuer' : 'À augmenter') + '</span>' +
      (num(k.baseline) != null ? '<span>Référence ' + esc(fmtNum(num(k.baseline), k)) + '</span>' : '') + (num(k.target) != null ? '<span>Cible ' + esc(fmtNum(num(k.target), k)) + '</span>' : '') + (k.responsible ? '<span>Collecte : ' + esc(k.responsible) + '</span>' : '') + '</div>' +
    '<div id="kdStat"></div>' +
    '<div class="kd-bar"><div class="view-toggle" id="kdGran">' + Object.entries(GRAN).filter(([g]) => GRAN_ORDER[g] >= GRAN_ORDER[g0]).map(([g, l]) => '<button data-g="' + g + '">' + l + '</button>').join('') + '</div>' +
      (k.aggregation === 'somme' ? '<div class="view-toggle" id="kdMode"><button data-m="per">Par période</button><button data-m="cum">Cumul</button></div>' : '') + '</div>' +
    '<div class="kd-chart" id="kdChart"></div>' +
    (canEdit() ? '<div class="sep"></div><h3 style="font-size:1rem;margin-bottom:.8rem">Saisir une valeur</h3><form id="kvf">' + periodInput(k) +
      '<div class="row"><label class="f"><span>Valeur' + (k.unit ? ' (' + esc(k.value_type === 'pourcentage' ? '%' : k.unit) + ')' : '') + ' *</span><input class="i" name="value" type="number" step="any" required></label>' +
      '<label class="f"><span>Commentaire</span><input class="i" name="comment" maxlength="1000" placeholder="Source, remarque…"></label></div>' +
      '<p class="fhint" id="kvHint"></p><p class="err" id="kvErr"></p><div style="display:flex;justify-content:flex-end"><button class="btn primary" type="submit">Enregistrer la valeur</button></div></form>' : '') +
    '<div class="sep"></div><h3 style="font-size:1rem;margin-bottom:.6rem">Historique des valeurs</h3><div id="kdTable"></div>' +
    (canEdit() ? '<div class="mfoot"><button class="btn" id="kdEdit">' + IC.edit + 'Modifier l\'indicateur</button></div>' : ''), true);

  const draw = () => {
    const st = kpiStatus(k);
    el.querySelector('#kdStat').innerHTML = '<div class="kd-stat"><div><b>' + esc(fmtNum(st.cur, k)) + '</b><small>' + (k.aggregation === 'somme' ? 'Cumul à ce jour' : k.aggregation === 'moyenne' ? 'Moyenne de la dernière période' : 'Dernière valeur') + '</small></div>' +
      (st.pr != null ? '<div><b style="color:' + st.c + '">' + Math.round(st.pr * 100) + '%</b><small>de la cible</small></div>' : '') + '<div><b style="color:' + st.c + ';font-size:1.05rem">' + esc(st.l) + '</b><small>' + (expectedProgress(k) != null ? 'Attendu à date : ' + Math.round(expectedProgress(k) * 100) + '%' : 'Statut') + '</small></div></div>';
    el.querySelectorAll('#kdGran button').forEach(b => b.classList.toggle('on', b.dataset.g === gran));
    el.querySelectorAll('#kdMode button').forEach(b => b.classList.toggle('on', (b.dataset.m === 'cum') === cumMode));
    el.querySelector('#kdChart').innerHTML = kpiChart(k, gran, { axis: true, w: 640, h: 220, cum: cumMode });
    const vals = valsOf(k.id).slice().reverse();
    el.querySelector('#kdTable').innerHTML = vals.length ? '<div class="tbl-wrap"><table style="min-width:0"><thead><tr><th>Période</th><th>Valeur</th><th>Commentaire</th><th>Saisi par</th>' + (canEdit() ? '<th></th>' : '') + '</tr></thead><tbody>' +
      vals.map(v => '<tr><td style="white-space:nowrap">' + esc(periodLabel(v.period_start, g0, true)) + '</td><td style="white-space:nowrap"><b>' + esc(fmtNum(Number(v.value), k)) + '</b></td><td style="color:var(--muted2)">' + esc(v.comment || '') + '</td><td style="color:var(--muted);font-size:.8rem">' + esc(v.author_name || '') + '</td>' +
        (canEdit() ? '<td style="white-space:nowrap"><button class="btn ghost sm" data-vedit="' + v.id + '">Modifier</button><button class="btn ghost sm" data-vdel="' + v.id + '" aria-label="Supprimer">✕</button></td>' : '') + '</tr>').join('') + '</tbody></table></div>'
      : '<div class="empty">Aucune valeur saisie pour l\'instant.</div>';
  };
  draw();
  el.querySelectorAll('#kdGran button').forEach(b => b.onclick = () => { gran = b.dataset.g; draw(); });
  el.querySelectorAll('#kdMode button').forEach(b => b.onclick = () => { cumMode = b.dataset.m === 'cum'; draw(); });
  const ke = el.querySelector('#kdEdit'); if (ke) ke.onclick = () => { close(); kpiModal(k); };
  const f = el.querySelector('#kvf');
  if (f) {
    const hint = () => { const ps = readPeriod(k, f); const ex = ps && S.kpiValues.find(v => v.kpi_id === k.id && v.period_start === ps);
      el.querySelector('#kvHint').textContent = ps ? (ex ? 'Une valeur existe déjà pour ' + periodLabel(ps, g0, true) + ' (' + fmtNum(Number(ex.value), k) + ') : elle sera remplacée.' : 'Période : ' + periodLabel(ps, g0, true) + '.') : ''; };
    f.oninput = hint; hint();
    if (focusValue && window.innerWidth > 860) setTimeout(() => f.value.focus(), 50);
    f.onsubmit = async e => {
      e.preventDefault();
      const ps = readPeriod(k, f), val = f.value.value;
      if (!ps) return el.querySelector('#kvErr').textContent = 'Indiquez une période valide.';
      if (val === '' || isNaN(Number(val))) return el.querySelector('#kvErr').textContent = 'Indiquez une valeur numérique.';
      if (k.value_type === 'pourcentage' && (Number(val) < 0 || Number(val) > 1000)) return el.querySelector('#kvErr').textContent = 'Un pourcentage doit être compris entre 0 et 100 (ou plus si dépassement).';
      el.querySelector('#kvErr').textContent = '';
      const me = S.members.find(m => m.user_id === S.user.id);
      const author = (S.user.user_metadata && S.user.user_metadata.full_name) || (me && me.display_name) || S.user.email;
      const ex = S.kpiValues.find(v => v.kpi_id === k.id && v.period_start === ps);
      const payload = { value: Number(val), comment: f.comment.value.trim(), author_name: author };
      const btn = f.querySelector('[type=submit]'); btn.disabled = true;
      const r = ex ? await sb.from('kpi_values').update(payload).eq('id', ex.id).select().single()
                   : await sb.from('kpi_values').insert(Object.assign(payload, { kpi_id: k.id, workspace_id: S.ws.id, period_start: ps })).select().single();
      btn.disabled = false;
      if (r.error) return el.querySelector('#kvErr').textContent = frErr(r.error);
      if (ex) Object.assign(ex, r.data); else S.kpiValues.push(r.data);
      f.value.value = ''; f.comment.value = ''; hint(); draw(); renderMain(); toast('Valeur enregistrée.');
    };
    el.querySelector('#kdTable').onclick = async e => {
      const ed = e.target.closest('[data-vedit]'), dl = e.target.closest('[data-vdel]');
      if (ed) {
        const v = S.kpiValues.find(x => x.id === ed.dataset.vedit), d = pd(v.period_start);
        if (f.pdate) f.pdate.value = v.period_start; if (f.pmonth) f.pmonth.value = d.getMonth(); if (f.pyear) f.pyear.value = d.getFullYear();
        f.value.value = v.value; f.comment.value = v.comment || ''; hint(); f.scrollIntoView({ behavior: 'smooth', block: 'center' }); f.value.focus();
      }
      if (dl) {
        if (!confirm('Supprimer cette valeur ?')) return;
        const { error } = await sb.from('kpi_values').delete().eq('id', dl.dataset.vdel);
        if (error) return toast(frErr(error), true);
        S.kpiValues = S.kpiValues.filter(x => x.id !== dl.dataset.vdel); draw(); renderMain(); toast('Valeur supprimée.');
      }
    };
  }
}

function exportKpiCsv() {
  const q = v => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"';

}

let tsLoading = null;
function loadTurnstile() {
  if (!TURNSTILE_SITEKEY) return Promise.resolve(null);
  if (window.turnstile) return Promise.resolve(window.turnstile);
  if (!tsLoading) tsLoading = new Promise((res, rej) => {
    window.__tsReady = () => res(window.turnstile);
    const sc = document.createElement('script');
    sc.src = 'https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit&onload=__tsReady';
    sc.async = true; sc.onerror = () => { tsLoading = null; rej(new Error('turnstile')); };
    document.head.appendChild(sc);
  });
  return tsLoading;
}

const ACC_ST = { pending: ['En attente', 'var(--warn)'], approved: ['Actif', 'var(--accent2)'], rejected: ['Refusé', 'var(--red)'], suspended: ['Suspendu', 'var(--red)'] };
const LEAD_ST = ['nouveau', 'contacté', 'en cours', 'gagné', 'perdu'];
S.adm = { tab: 'comptes', accounts: [], leads: [], loaded: false };

async function loadAdmin() {
  const [a, l] = await Promise.all([
    sb.from('profiles').select('id, email, full_name, organization, status, created_at, decided_at, user_notified_at').order('created_at', { ascending: false }),
    sb.from('leads').select('id, kind, nom, email, entreprise, telephone, sujet, secteur, message, cours, parcours, statut, created_at').order('created_at', { ascending: false }).limit(500)
  ]);
  if (a.error) throw a.error;
  S.adm.accounts = a.data || []; S.adm.leads = l.error ? [] : (l.data || []); S.adm.loaded = true;

const pendingCount = () => S.adm.accounts.filter(x => x.status === 'pending').length;

function viewAdmin() {
  if (!S.adm.loaded) { loadAdmin().then(() => { if (S.view === 'admin') renderMain(); }).catch(e => toast(frErr(e), true)); return '<div class="loading" style="min-height:40vh"><div class="spin"></div></div>'; }
  const pend = S.adm.accounts.filter(x => x.status === 'pending');
  const others = S.adm.accounts.filter(x => x.status !== 'pending');

  const head = '<div class="top"><div><div class="crumb">Plateforme ASAP WORKPLAN</div><h2>Administration</h2></div><div class="actions"><button class="btn" id="admReload">Actualiser</button></div></div>' +

    '<div class="view-toggle" style="margin-bottom:1.2rem"><button data-admtab="comptes" class="' + (S.adm.tab === 'comptes' ? 'on' : '') + '">Comptes' + (pend.length ? ' (' + pend.length + ' à valider)' : '') + '</button><button data-admtab="demandes" class="' + (S.adm.tab === 'demandes' ? 'on' : '') + '">Demandes du site' + (newLeads ? ' (' + newLeads + ')' : '') + '</button></div>';
  if (S.adm.tab === 'demandes') return head + viewLeads();
  const accRow = (x, big) => {
    const st = ACC_ST[x.status] || ['?', 'var(--muted)'], me = x.id === S.user.id;
    const acts = me ? '<span class="tag">Vous</span>' :
      x.status === 'pending' ? '<button class="btn primary sm" data-acc="' + x.id + '" data-st="approved">Activer le compte</button><button class="btn danger sm" data-acc="' + x.id + '" data-st="rejected">Refuser</button>' :
      x.status === 'approved' ? '<button class="btn sm" data-acc="' + x.id + '" data-st="suspended">Suspendre</button>' :
      '<button class="btn sm" data-acc="' + x.id + '" data-st="approved">Activer</button>';
    return '<div class="acc-row' + (big ? ' big' : '') + '"><div class="av">' + esc(initials(x.full_name || x.email)) + '</div>' +
      '<div class="who"><div><b>' + esc(x.full_name || 'Sans nom') + '</b> <span class="kpill" style="color:' + st[1] + '">' + st[0] + '</span></div>' +
      '<small>' + esc(x.email || '') + (x.organization ? ' · ' + esc(x.organization) : '') + ' · inscrit le ' + fdt(x.created_at) + (x.status === 'approved' && x.user_notified_at ? ' · e-mail d\'activation envoyé' : '') + '</small></div>' +

async function decideAccount(id, status, btn) {
  const acc = S.adm.accounts.find(x => x.id === id);
  const label = { approved: 'activer', rejected: 'refuser', suspended: 'suspendre' }[status];
  if (status !== 'approved' && !confirm('Voulez-vous ' + label + ' le compte de ' + (acc.full_name || acc.email) + ' ? Il perdra immédiatement tout accès aux données.')) return;
  btn.disabled = true;
  try {
    const { data, error } = await sb.functions.invoke('account-decision', { body: { user_id: id, status } });
    if (error) {
      let msg = error.message;
      try { const j = await error.context.json(); if (j && j.error) msg = j.error; } catch (e) {}
      throw new Error(msg);
    }
    if (status === 'approved') toast(data && data.emailSent ? 'Compte activé. L\'utilisateur a reçu un e-mail de confirmation.' : 'Compte activé, mais l\'e-mail n\'a pas pu être envoyé (' + ((data && data.emailError) || 'service e-mail non configuré') + ').', !(data && data.emailSent));
    else toast(status === 'rejected' ? 'Demande refusée.' : 'Compte suspendu : tout accès est coupé.');
    await loadAdmin(); renderMain(); renderNavBadge();
  } catch (e) { toast(frErr(e), true); btn.disabled = false; }
}

function bindAdmin(m) {
  m.querySelectorAll('[data-admtab]').forEach(b => b.onclick = () => { S.adm.tab = b.dataset.admtab; renderMain(); });
  const rl = m.querySelector('#admReload'); if (rl) rl.onclick = async () => { S.adm.loaded = false; renderMain(); };
  m.querySelectorAll('[data-acc]').forEach(b => b.onclick = () => decideAccount(b.dataset.acc, b.dataset.st, b));
  m.querySelectorAll('[data-lead]').forEach(sel => sel.onchange = async () => {
    const { error } = await sb.from('leads').update({ statut: sel.value }).eq('id', sel.dataset.lead);
    if (error) return toast(frErr(error), true);
    const l = S.adm.leads.find(x => x.id === sel.dataset.lead); if (l) l.statut = sel.value; toast('Statut mis à jour.');
  });
}
function renderNavBadge() {
  const n = pendingCount();

const isIOS = () => /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const isStandalone = () => matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredPrompt = e; setupInstall(); });
window.addEventListener('appinstalled', () => { deferredPrompt = null; setupInstall(); toast('Application installée !'); });
function setupInstall() {
  const b = $('#installBtn'); if (!b) return;
  b.classList.toggle('hidden', !deferredPrompt || isStandalone());
  b.onclick = async () => { if (!deferredPrompt) return; deferredPrompt.prompt(); await deferredPrompt.userChoice; deferredPrompt = null; setupInstall(); };
}
if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
window.addEventListener('online', async () => { S.online = true; toast('Connexion rétablie.'); if (S.ws && sb) { try { const { data: { session } } = await sb.auth.getSession(); if (session) { S.user = session.user; await loadData(); subscribe(); render(); } } catch (e) {} } });
window.addEventListener('offline', () => { S.online = false; S.cachedAt = Date.now(); if (S.ws) renderMain(); });

if (sb) sb.auth.onAuthStateChange((event, session) => {
  if (event === 'PASSWORD_RECOVERY') { RECOVERY = true; renderAuth('newpass'); }
  else if (event === 'SIGNED_IN' && !S.user && !RECOVERY) { S.user = session.user; checkAccount().then(ok => { if (ok) loadWorkspaces(); }); }
  else if (event === 'SIGNED_OUT') { S.user = null; }
});
boot();
</script>
</body>
</html>
